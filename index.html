<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070605" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>1v1 Texas Hold'em</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Portrait Orientation Warning Overlay -->
  <div id="portrait-overlay" aria-hidden="true">
    <div class="portrait-box">
      <div class="phone-rotate-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="8" width="28" height="48" rx="4" stroke="currentColor" stroke-width="2.5" />
          <line x1="29" y1="13" x2="35" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          <circle cx="32" cy="50" r="2" fill="currentColor" />
          <path d="M52 24C55 29 55 35 52 40" stroke="#c99e5a" stroke-width="2" stroke-linecap="round" />
          <path d="M52 40L48 37M52 40L55 37" stroke="#c99e5a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>
      <p class="portrait-title">Поверніть телефон горизонтально</p>
      <p class="portrait-sub">Гра розроблена для горизонтального режиму (Landscape)</p>
    </div>
  </div>

  <!-- Main 16:9 / Fullscreen Viewport Container -->
  <main id="app-viewport">

    <!-- START MENU (Minimalist + Liquid Glass + Live Floating Noir Canvas + Vignette) -->
    <section id="start-menu" class="screen active">
      <canvas id="menu-bg-canvas" aria-hidden="true"></canvas>

      <div class="menu-ambient" aria-hidden="true">
        <div class="menu-spotlight"></div>
        <div class="menu-vignette"></div>
      </div>

      <div class="menu-actions-only">
        <button id="btn-story" class="liquid-glass-btn primary-glass" type="button">
          <span class="glass-sheen" aria-hidden="true"></span>
          <span class="btn-label">Грати (Сюжет)</span>
        </button>

        <div id="freeplay-btn-wrap" class="freeplay-wrap">
          <button id="btn-freeplay" class="liquid-glass-btn secondary-glass is-locked" type="button" disabled aria-disabled="true">
            <span class="glass-sheen" aria-hidden="true"></span>
            <span id="freeplay-lock-icon" class="lock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="11" width="14" height="10" rx="2.5" stroke="currentColor" stroke-width="1.8" />
                <path d="M8 11V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </span>
            <span class="btn-label">Вільна гра</span>
          </button>
        </div>
      </div>
    </section>

    <!-- FULLSCREEN VIDEO LAYER (100dvw x 100dvh, black bg, object-fit: contain) -->
    <section id="video-layer" class="screen hidden" aria-hidden="true">
      <video
        id="cutscene-video"
        src="Startplot.mp4"
        preload="auto"
        playsinline
        webkit-playsinline
        disablePictureInPicture
        controlsList="nodownload nofullscreen noremoteplayback"
      ></video>

      <!-- Minimalist Buffering / Loading Indicator -->
      <div id="video-loader" class="video-loader hidden" aria-live="polite">
        <div class="noir-spinner" aria-hidden="true"></div>
        <span class="loader-text">Завантаження...</span>
      </div>

      <!-- Fallback Liquid Glass Play Button if Browser Blocks Autoplay -->
      <div id="video-manual-overlay" class="video-manual-overlay hidden">
        <button id="btn-video-manual-play" class="liquid-glass-btn primary-glass video-start-btn" type="button">
          <span class="glass-sheen" aria-hidden="true"></span>
          <span class="btn-label">Почати</span>
        </button>
      </div>
    </section>

    <!-- GAME SCREEN (TOP-DOWN TABLE & HARDCORE HUD) -->
    <section id="game-screen" class="screen hidden">
      <div id="poker-table-outer">
        <div id="poker-table-wood">
          <div id="poker-table-brass">
            <div id="poker-table-felt">
              <!-- Subtle inner felt betting line -->
              <div class="felt-line"></div>

              <!-- TOP-LEFT DECOR: Detailed Ashtray with Smoldering Cigar/Cigarette & Canvas Smoke -->
              <div class="table-prop prop-ashtray" aria-hidden="true">
                <div class="ashtray-shadow"></div>
                <svg class="ashtray-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="ashBowlGrad" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stop-color="#141110" />
                      <stop offset="65%" stop-color="#221d1a" />
                      <stop offset="85%" stop-color="#3d322c" />
                      <stop offset="100%" stop-color="#191412" />
                    </radialGradient>
                    <linearGradient id="brassRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="#c9a05b" />
                      <stop offset="35%" stop-color="#7c5c2b" />
                      <stop offset="70%" stop-color="#e0be7e" />
                      <stop offset="100%" stop-color="#4e3716" />
                    </linearGradient>
                    <linearGradient id="cigarBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                      <stop offset="0%" stop-color="#5e3a22" />
                      <stop offset="45%" stop-color="#875636" />
                      <stop offset="100%" stop-color="#3c2212" />
                    </linearGradient>
                    <radialGradient id="emberGlow" cx="50%" cy="50%" r="50%">
                      <stop offset="0%" stop-color="#fff3b0" />
                      <stop offset="40%" stop-color="#ff5e1a" />
                      <stop offset="75%" stop-color="#b51c04" />
                      <stop offset="100%" stop-color="#2e2a29" stop-opacity="0" />
                    </radialGradient>
                  </defs>
                  <circle cx="60" cy="60" r="46" fill="url(#brassRimGrad)" />
                  <circle cx="60" cy="60" r="42" fill="#1e1916" />
                  <rect x="54" y="12" width="12" height="10" rx="3" fill="#2c2219" />
                  <rect x="54" y="98" width="12" height="10" rx="3" fill="#2c2219" />
                  <rect x="12" y="54" width="10" height="12" rx="3" fill="#2c2219" />
                  <rect x="98" y="54" width="10" height="12" rx="3" fill="#2c2219" />
                  <circle cx="60" cy="60" r="33" fill="url(#ashBowlGrad)" stroke="#6f532a" stroke-width="1.5" />
                  <ellipse cx="56" cy="63" rx="14" ry="9" fill="#3a3635" opacity="0.65" transform="rotate(-18 56 63)" />
                  <ellipse cx="63" cy="57" rx="10" ry="7" fill="#524d4b" opacity="0.5" transform="rotate(25 63 57)" />
                  <circle cx="51" cy="56" r="2.5" fill="#6e6865" opacity="0.6" />
                  <circle cx="66" cy="66" r="1.8" fill="#77716e" opacity="0.5" />
                  <g transform="rotate(28 60 60)">
                    <rect x="14" y="57" width="52" height="11" rx="3" fill="rgba(0,0,0,0.55)" />
                    <rect x="12" y="54" width="22" height="10" rx="2.5" fill="url(#cigarBodyGrad)" />
                    <rect x="33" y="54" width="3.5" height="10" fill="#d4af63" />
                    <rect x="36.5" y="54" width="23" height="10" fill="#d8cfc0" />
                    <rect x="58" y="54" width="3.5" height="10" fill="#241f1e" />
                    <path d="M61.5 54.2 C66 54.5, 68 56, 68 59 C68 62, 66 63.5, 61.5 63.8 Z" fill="#8c8684" />
                    <circle class="cigar-ember" cx="62" cy="59" r="6.5" fill="url(#emberGlow)" />
                  </g>
                </svg>
                <canvas id="smoke-canvas" width="160" height="160"></canvas>
              </div>

              <!-- TOP-RIGHT DECOR: Glass Tumbler with Amber Rum & Ice Cubes -->
              <div class="table-prop prop-tumbler" aria-hidden="true">
                <div class="tumbler-caustic"></div>
                <svg class="tumbler-svg" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
                  <defs>
                    <radialGradient id="rumGrad" cx="42%" cy="42%" r="55%">
                      <stop offset="0%" stop-color="#f2a33a" stop-opacity="0.92" />
                      <stop offset="45%" stop-color="#b85712" stop-opacity="0.95" />
                      <stop offset="80%" stop-color="#692304" stop-opacity="0.98" />
                      <stop offset="100%" stop-color="#361002" />
                    </radialGradient>
                    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="rgba(255,255,255,0.65)" />
                      <stop offset="30%" stop-color="rgba(255,255,255,0.12)" />
                      <stop offset="70%" stop-color="rgba(255,255,255,0.08)" />
                      <stop offset="100%" stop-color="rgba(255,220,160,0.45)" />
                    </linearGradient>
                    <linearGradient id="iceGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stop-color="rgba(255, 245, 225, 0.72)" />
                      <stop offset="50%" stop-color="rgba(240, 175, 95, 0.35)" />
                      <stop offset="100%" stop-color="rgba(160, 75, 18, 0.45)" />
                    </linearGradient>
                  </defs>
                  <circle cx="60" cy="60" r="44" fill="rgba(18, 12, 9, 0.55)" stroke="url(#glassRim)" stroke-width="3.5" />
                  <circle cx="60" cy="60" r="39" fill="none" stroke="rgba(255, 235, 200, 0.14)" stroke-width="1.2" />
                  <circle cx="60" cy="60" r="37" fill="url(#rumGrad)" />
                  <g transform="rotate(-18 51 53)">
                    <rect x="38" y="40" width="24" height="24" rx="4.5" fill="url(#iceGrad1)" stroke="rgba(255, 245, 220, 0.6)" stroke-width="1.2" />
                    <path d="M41 44 L56 44 L44 57" fill="none" stroke="rgba(255,255,255,0.38)" stroke-width="1.2" stroke-linecap="round" />
                  </g>
                  <g transform="rotate(27 69 65)">
                    <rect x="57" y="53" width="22" height="22" rx="4" fill="url(#iceGrad1)" stroke="rgba(255, 240, 210, 0.52)" stroke-width="1.1" />
                    <path d="M60 57 L74 57" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-linecap="round" />
                  </g>
                  <path d="M 31 44 A 34 34 0 0 1 82 32" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.2" stroke-linecap="round" />
                  <path d="M 34 78 A 35 35 0 0 0 85 80" fill="none" stroke="rgba(255, 195, 110, 0.3)" stroke-width="1.6" stroke-linecap="round" />
                </svg>
              </div>

              <!-- ===================== BOSS ZONE (TOP) ===================== -->
              <div id="boss-zone" class="player-zone top-zone">
                <div class="zone-hud boss-hud">
                  <div class="avatar-badge boss-badge">
                    <span class="role-name">БОС</span>
                    <span id="boss-dealer-btn" class="dealer-chip hidden" title="Дилер">D</span>
                  </div>
                  <div class="stack-box">
                    <span class="chip-icon"></span>
                    <span id="boss-chips" class="chip-amount">2000</span>
                  </div>
                  <div id="boss-action-status" class="action-pill">Очікування</div>
                </div>

                <div class="cards-and-bet">
                  <div id="boss-cards" class="hole-cards boss-hole-cards">
                    <div class="card-slot" data-slot="0"></div>
                    <div class="card-slot" data-slot="1"></div>
                  </div>
                  <div id="boss-bet-pill" class="bet-on-felt hidden">
                    <span class="mini-chip"></span>
                    <span id="boss-bet-val">0</span>
                  </div>
                </div>
              </div>

              <!-- ===================== CENTER BOARD (COMMUNITY CARDS, POT & RESULT BANNER) ===================== -->
              <div id="center-board">
                <div id="pot-container">
                  <div class="pot-chips-stack" aria-hidden="true">
                    <span class="p-chip c1"></span>
                    <span class="p-chip c2"></span>
                    <span class="p-chip c3"></span>
                  </div>
                  <div class="pot-info">
                    <span class="pot-label">БАНК</span>
                    <span id="pot-amount">0</span>
                  </div>
                </div>

                <div id="community-cards">
                  <div class="comm-slot" data-index="0"></div>
                  <div class="comm-slot" data-index="1"></div>
                  <div class="comm-slot" data-index="2"></div>
                  <div class="comm-slot" data-index="3"></div>
                  <div class="comm-slot" data-index="4"></div>
                </div>

                <!-- Round Result Announcement Banner -->
                <div id="round-result-banner" class="result-banner hidden" aria-live="polite">
                  <span id="round-result-text"></span>
                </div>
              </div>

              <!-- ===================== PLAYER ZONE (BOTTOM) ===================== -->
              <div id="player-zone" class="player-zone bottom-zone">
                <div class="cards-and-bet">
                  <div id="player-bet-pill" class="bet-on-felt hidden">
                    <span class="mini-chip"></span>
                    <span id="player-bet-val">0</span>
                  </div>
                  <div id="player-cards" class="hole-cards player-hole-cards">
                    <div class="card-slot" data-slot="0"></div>
                    <div class="card-slot" data-slot="1"></div>
                  </div>
                </div>

                <div class="zone-hud player-hud">
                  <div class="avatar-badge player-badge">
                    <span class="role-name">ВИ</span>
                    <span id="player-dealer-btn" class="dealer-chip hidden" title="Дилер">D</span>
                  </div>
                  <div class="stack-box">
                    <span class="chip-icon gold"></span>
                    <span id="player-chips" class="chip-amount">2000</span>
                  </div>
                  <div id="player-action-status" class="action-pill hidden"></div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- ===================== ACTION CONTROLS PANEL (BOTTOM BAR) ===================== -->
      <footer id="controls-bar" class="controls-disabled">
        <!-- Raise Drawer / Compact Selector -->
        <div id="raise-panel" class="raise-popup hidden">
          <div class="raise-presets">
            <button type="button" class="preset-btn" data-preset="min">Мін</button>
            <button type="button" class="preset-btn" data-preset="half">½ Банку</button>
            <button type="button" class="preset-btn" data-preset="pot">Банк</button>
            <button type="button" class="preset-btn" data-preset="max">Макс</button>
          </div>
          <div class="raise-slider-row">
            <button type="button" id="raise-minus" class="step-btn" aria-label="Менше">−</button>
            <input type="range" id="raise-slider" min="40" max="2000" step="20" value="80" />
            <button type="button" id="raise-plus" class="step-btn" aria-label="Більше">+</button>
            <span id="raise-display-val" class="raise-val-badge">80</span>
          </div>
        </div>

        <div class="action-buttons-row">
          <button type="button" id="btn-fold" class="act-btn btn-fold">
            <span class="act-main">Fold</span>
            <span class="act-sub">Пас</span>
          </button>

          <button type="button" id="btn-check-call" class="act-btn btn-call">
            <span id="check-call-main" class="act-main">Check</span>
            <span id="check-call-sub" class="act-sub">Чек</span>
          </button>

          <button type="button" id="btn-raise" class="act-btn btn-raise">
            <span id="raise-btn-main" class="act-main">Raise</span>
            <span id="raise-btn-sub" class="act-sub">Підняти</span>
          </button>

          <button type="button" id="btn-allin" class="act-btn btn-allin">
            <span class="act-main">All-in</span>
            <span id="allin-sub" class="act-sub">Ва-банк</span>
          </button>
        </div>
      </footer>
    </section>

    <!-- FINAL END-OF-GAME OVERLAY -->
    <section id="final-overlay" class="screen hidden">
      <div class="final-card">
        <div class="final-emblem" aria-hidden="true">♠ ♥ ♣ ♦</div>
        <h2 id="final-title" class="final-title">Партію завершено</h2>
        <p id="final-desc" class="final-desc">За цим столом ставки зроблено.</p>
        <button id="btn-back-menu" class="liquid-glass-btn primary-glass" type="button">
          <span class="glass-sheen" aria-hidden="true"></span>
          <span class="btn-label">Повернутися в головне меню</span>
        </button>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
